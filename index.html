<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />

    <!-- 浏览器标签页 Icon -->
    <link
      rel="icon"
      href="https://s1.eisite.cn/autoupload/amqnh/20260821/dHbf/1280X1280/00-d55fd7352057ecab338faca8.png/webp"
    />

    <!-- iOS 苹果手机添加到主屏幕的 App 图标（关键配置） -->
    <link
      rel="apple-touch-icon"
      href="https://s1.eisite.cn/autoupload/amqnh/20260821/dHbf/1280X1280/00-d55fd7352057ecab338faca8.png/webp"
    />
    <link
      rel="apple-touch-icon-precomposed"
      href="https://s1.eisite.cn/autoupload/amqnh/20260821/dHbf/1280X1280/00-d55fd7352057ecab338faca8.png/webp"
    />

        <!-- PWA Manifest 引用 -->
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />

    <!-- Noto Serif SC：给 memory 等页面的标题衬线字体用，直接加载字体文件，
         不再依赖访问设备上恰好装了什么系统衬线字体（之前"字体被改粗了"的
         问题根源就是系统字体不稳定）。注意：Google Fonts 在国内网络环境下
         可能被墙，访问不到时会自动退回各处 CSS 里已经写好的系统字体兜底
         （不会报错、也不会空白），只是回到之前那种"看设备"的不稳定状态。 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;700&display=swap"
      rel="stylesheet"
      crossorigin="anonymous"
    />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />

    <meta name="theme-color" content="#fcfbf7" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="WHEN I with U" />

    <title>WHEN I with U</title>
  </head>

  <body class="antialiased min-h-screen selection:bg-stone-300 selection:text-stone-900">

<div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
